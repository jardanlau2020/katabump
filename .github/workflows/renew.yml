name: Katabump Auto Renew

on:
  schedule:
    # 每日 UTC 02:00 = 北京時間 10:00
    # 每日跑：未到續期窗口時腳本會讀到 "can't renew" 提示並提早結束（幾秒收工），
    # 好處是 Turnstile 失敗後第二日自動再試，唔會等 3 日錯過到期。
    - cron: '0 2 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    steps:
      - name: 檢出
        uses: actions/checkout@v7

      # 遷移說明：原先是手寫的 5 個步驟（setup-python / apt+pip / 代理 / 執行 / 上傳截圖），
      # 現改用 renew-kit 的 composite action 統一收口：
      #   · apt-packages   -> xvfb / xdotool / scrot / 中文字體 / jq（代理腳本要用 jq）
      #   · pip-packages   -> seleniumbase / requests
      #   · setup-command  -> 裝 chromedriver + 掛 sing-box 代理（結果寫入 $GITHUB_ENV）
      #   · command        -> 用 xvfb-run 包住 headful 瀏覽器
      #   · artifact-paths -> 失敗時上傳截圖與日誌，排障用
      # 面板憑據經由本 step 的 env 傳入，composite action 會繼承。
      # 續期結果語義（RENEWED / SKIPPED / UNKNOWN / TRANSIENT / FAILED）由 renewkit 統一裁決。
      # renew-kit 釘在 tag 上（action 與 pip 兩處都要釘）：main 上出過一次 composite
      # action 的語法錯（空 then 分支），所有跟 @main 的倉庫一起變紅。升級就改這兩個 v0.4.2。
      - name: 執行續期
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.5.3
        with:
          script: app.py
          python-version: "3.12"
          renewkit-ref: v0.5.3
          apt-packages: "xvfb x11-utils xdotool scrot fonts-noto-cjk jq"
          pip-packages: "seleniumbase requests"
          setup-command: |
            seleniumbase install chromedriver || true
            bash ./setup_proxy.sh || true
          setup-continue-on-error: "true"
          command: 'xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py'
          artifact-paths: |
            *.png
            latest_logs/
          artifact-name: failure-screenshots
        env:
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: 🧹 清理舊的工作流運行記錄（保留最近 10 條）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 10 ]; then
              echo "刪除運行記錄: $run_id"
              gh run delete "$run_id" || true
            fi
          done
