name: Katabump Auto Renew

on:
  schedule:
    # 姣忔棩 UTC 02:00 = 鍖椾含鏅傞枔 10:00
    # 姣忔棩璺戯細鏈埌绾屾湡绐楀彛鏅傝叧鏈渻璁€鍒?"can't renew" 鎻愮ず涓︽彁鏃╃祼鏉燂紙骞剧鏀跺伐锛夛紝
    # 濂借檿鏄?Turnstile 澶辨晽寰岀浜屾棩鑷嫊鍐嶈│锛屽敂鏈冪瓑 3 鏃ラ尟閬庡埌鏈熴€?
    - cron: '0 2 * * *'
  workflow_dispatch: # 鍏佽ū鎵嬪嫊瑙哥櫦

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    steps:
      - name: 妾㈠嚭
        uses: actions/checkout@v7

      # 閬风Щ瑾槑锛氬師鍏堟槸鎵嬪鐨?5 鍊嬫椹燂紙setup-python / apt+pip / 浠ｇ悊 / 鍩疯 / 涓婂偝鎴湒锛夛紝
      # 鐝炬敼鐢?renew-kit 鐨?composite action 绲变竴鏀跺彛锛?
      #   路 apt-packages   -> xvfb / xdotool / scrot / 涓枃瀛楅珨 / jq锛堜唬鐞嗚叧鏈鐢?jq锛?
      #   路 pip-packages   -> seleniumbase / requests
      #   路 setup-command  -> 瑁?chromedriver + 鎺?sing-box 浠ｇ悊锛堢祼鏋滃鍏?$GITHUB_ENV锛?
      #   路 command        -> 鐢?xvfb-run 鍖呬綇 headful 鐎忚鍣?
      #   路 artifact-paths -> 澶辨晽鏅備笂鍌虫埅鍦栬垏鏃ヨ獙锛屾帓闅滅敤
      # 闈㈡澘鎲戞摎缍撶敱鏈?step 鐨?env 鍌冲叆锛宑omposite action 鏈冪辜鎵裤€?
      # 绾屾湡绲愭灉瑾炵京锛圧ENEWED / SKIPPED / UNKNOWN / TRANSIENT / FAILED锛夌敱 renewkit 绲变竴瑁佹焙銆?
      # renew-kit 閲樺湪 tag 涓婏紙action 鑸?pip 鍏╄檿閮借閲橈級锛歮ain 涓婂嚭閬庝竴娆?composite
      # action 鐨勮獮娉曢尟锛堢┖ then 鍒嗘敮锛夛紝鎵€鏈夎窡 @main 鐨勫€夊韩涓€璧疯畩绱呫€傚崌绱氬氨鏀归€欏叐鍊?v0.4.2銆?
      - name: 鍩疯绾屾湡
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.6.0
        with:
          script: app.py
          python-version: "3.12"
          renewkit-ref: v0.6.0
          apt-packages: "xvfb x11-utils xdotool scrot fonts-noto-cjk jq"
          pip-packages: "seleniumbase requests"
          setup-command: |
            seleniumbase install chromedriver || true
            bash ./setup_proxy.sh || true
          setup-continue-on-error: "true"
          command: 'xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py'
          artifact-paths: |
            *.png
            latest_logs/
          artifact-name: failure-screenshots
        env:
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      # 2026-10-13 鍔狅細TRANSIENT 璺抽亷锛坋xit 0锛夊敂鏈冭Ц鐧?renew-kit 鐨?failure()
      # 涓婂偝锛屼箣鍓嶉€ｇ簩 4 杞夎烦閬庝總闆惰瓑鎿氥€佺劇娉曞畾浣嶃€傛敼鐐虹劇璜栨垚鏁楅兘涓婂偝銆?
      - name: 馃搸 涓婂偝鎺掗殰鐢㈢墿锛堝惈 TRANSIENT 璺抽亷锛?
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-evidence
          path: |
            crash_page.html
            crash_login.png
            login_fill_email_fail.png
            login_fill_password_fail.png
            login_failed.png
            login_turnstile_fail.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 馃Ч 娓呯悊鑸婄殑宸ヤ綔娴侀亱琛岃閷勶紙淇濈暀鏈€杩?10 姊濓級
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 10 ]; then
              echo "鍒櫎閬嬭瑷橀寗: $run_id"
              gh run delete "$run_id" || true
            fi
          done

